name: Vivecraft OpenXR (NeoForge 26.3)

# Builds the NeoForge variant of the Quest/OpenXR Vivecraft port.
# Source: cff1028/VivecraftMod, pinned to the audited commit below (tag 26.3-1.3.18-OpenXR).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vivecraft-neoforge.yml"
      - "vivecraft/**"

env:
  VIVECRAFT_REPO: https://github.com/cff1028/VivecraftMod
  VIVECRAFT_COMMIT: 871c83f   # audited 2026-11-18 against upstream Vivecraft 26.3-1.3.18

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the audited Vivecraft OpenXR source
        run: |
          git clone --filter=blob:none "$VIVECRAFT_REPO" vc-src
          cd vc-src
          git checkout "$VIVECRAFT_COMMIT"
          git log -1 --oneline

      - name: Apply QyestCraft patches
        working-directory: vc-src
        run: |
          # build only NeoForge (the fork builds Fabric only by default)
          # settings.gradle reads these switches from local.properties
          printf 'project.build.excludeNeoforge=false\nproject.build.excludeFabric=true\n' > local.properties
          sed -i 's/^mod_description=.*/mod_description=Vivecraft with Quest standalone OpenXR support (QyestCraft NeoForge build)./' gradle.properties
          if ls ../vivecraft/patches/*.patch >/dev/null 2>&1; then
            for p in ../vivecraft/patches/*.patch; do echo "applying $p"; git apply --whitespace=nowarn "$p"; done
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge jar
        working-directory: vc-src
        run: ./gradlew --no-daemon --stacktrace :neoforge:build -x test

      - name: Collect jar
        run: |
          mkdir -p out
          ls -la vc-src/neoforge/build/libs/
          for j in vc-src/neoforge/build/libs/*.jar; do case "$j" in *-sources.jar|*-api*.jar|*-slim.jar) ;; *) cp "$j" out/;; esac; done
          ls -la out
          for j in out/*.jar; do echo "== $j"; unzip -l "$j" | grep -E "openxr/MCOpenXR|QuestSdl|neoforge.mods.toml|META-INF/jarjar/" ; done
          sha256sum out/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: vivecraft-26.3-openxr-neoforge
          path: out/*.jar

      - name: Publish as a GitHub release (used by the launcher and the website)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=vivecraft-26.3-openxr-neoforge
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Vivecraft 26.3 OpenXR (NeoForge, QyestCraft build)" --notes "Built from cff1028/VivecraftMod@${VIVECRAFT_COMMIT} by GitHub Actions." --prerelease
          gh release upload "$TAG" out/*.jar --clobber
